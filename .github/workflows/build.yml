name: Build Amira APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev libasound2-dev acl

      - name: Install Stable Buildozer and Cython
        run: |
          pip3 install --user buildozer==1.5.0 cython==0.29.33

      - name: Force Accept Android SDK 37 License
        run: |
          # Создаем системную папку лицензий Android SDK внутри Buildozer до его старта
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses || true
          # Записываем туда официальный хэш-код лицензии Google, который закрывает ошибку 37-й версии
          echo -e "89354db274b0091589d8694c3d4c9153ea0ec681\n24333f1a63b6b82d1e1ad14079412178983e6519" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Compile APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer -v android debug
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amira-APK
          path: bin/*.apk
