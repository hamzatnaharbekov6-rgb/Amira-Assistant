name: Build Amira APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev libasound2-dev acl

      - name: Install Pure Old Buildozer
        run: |
          # Откатываем компилятор на старую стабильную версию, которая не знает про Python 3.14
          pip3 install --user buildozer==1.2.0 cython==0.29.33

      - name: Compile APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          yes | buildozer -v android debug
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amira-APK
          path: bin/*.apk
