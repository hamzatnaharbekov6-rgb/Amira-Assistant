name: Build Amira APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev libasound2-dev acl

      - name: Install Buildozer
        run: |
          pip3 install --user --upgrade buildozer

      - name: Compile APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          # Запускаем сборку, Buildozer сам предложит принять лицензии во время скачивания SDK
          buildozer -v android debug
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amira-APK
          path: bin/*.apk
