name: Build Amira APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev libasound2-dev acl

      - name: Install Latest Stable Buildozer and Cython
        run: |
          # Ставим стабильную версию 2.1.3, в которой исправлен путь к sdkmanager
          pip3 install --user buildozer==2.1.3 cython==0.29.33

      - name: Fix Android Build-Tools 37
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0 || true
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0 || true
          touch ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl
          touch ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/aidl
          chmod +x ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl
          chmod +x ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/aidl

      - name: Compile APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer -v android debug
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amira-APK
          path: bin/*.apk
